<!DOCTYPE html>
<html>
<head>
<title>CSS 46 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:1000px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:30px;max-width:450px;transition:.3s}
.card:hover{transform:translateY(-8px);border-color:#ff6422}
.icon{font-size:35px;color:#ff6422}
button{background:#ff6422;color:white;border:0;padding:12px 20px;border-radius:8px}
</style>
</head>
<body>

<nav><div class="logo">Dev<span>Core.</span></div></nav>

<main>
<span class="tag">CSS PRACTICAL 46</span>
<h1>SaaS Card</h1>
<p class="desc">Reusable card component.</p>

<div class="card">
<div class="icon">◆</div>
<h2>Analytics Workspace</h2>
<p>Track your team's performance using a centralized analytics workspace.</p>
<button>Open Workspace</button>
</div>

</main>
</body>
</html>
