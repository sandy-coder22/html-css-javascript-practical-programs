<!DOCTYPE html>
<html>
<head>
    <title>CSS Combinators | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        nav a {
            color: #999999;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6422;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 45px;
        }

        .description {
            color: #999999;
            font-size: 18px;
        }

        .card {
            background: #151515;
            border: 1px solid #2a2a2a;
            padding: 30px;
            margin-top: 40px;
            border-radius: 10px;
        }

        .card h2 {
            color: #ff6422;
        }

        /* Descendant */
        .card p {
            color: #ff6422;
        }

        /* Child */
        .card > h2 {
            color: white;
        }

        /* Adjacent sibling */
        h2 + p {
            background: #222222;
            padding: 12px;
        }

        /* General sibling */
        h2 ~ span {
            color: #999999;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Dev<span>Core.</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 03</div>

    <h1>Combinator Selectors</h1>

    <p class="description">
        Descendant, Child, Adjacent Sibling and General Sibling selectors.
    </p>

    <div class="card">

        <h2>Combinator Examples</h2>

        <p>Adjacent sibling selector</p>

        <span>General sibling selector</span>

        <p>Descendant selector example</p>

    </div>

</div>

</body>
</html>
