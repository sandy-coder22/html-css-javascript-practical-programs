<!DOCTYPE html>
<html>
<head>
<title>CSS 58 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
header{min-height:600px;background:#111;border-bottom:1px solid #2a2a2a}
nav{height:70px;display:flex;align-items:center;padding:0 8%;border-bottom:1px solid #2a2a2a}
.logo{font-size:25px;font-weight:bold;margin-right:auto}.logo span{color:#ff6422}
nav a{color:#999;text-decoration:none;margin-left:25px}
.hero{text-align:center;padding:100px 20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:65px;margin:20px 0}
p{color:#999;font-size:18px}
button{background:#ff6422;border:0;color:white;padding:14px 25px;border-radius:8px}
</style>
</head>
<body>

<header>
<nav>
<div class="logo">Dev<span>Core.</span></div>
<a href="#">Features</a>
<a href="#">Pricing</a>
<a href="#">Docs</a>
<a href="#">Login</a>
</nav>

<div class="hero">
<span class="tag">THE MODERN SAAS PLATFORM</span>
<h1>Everything your team needs.</h1>
<p>Analytics, automation and AI in one powerful workspace.</p>
<button>Get Started</button>
</div>
</header>

</body>
</html>
