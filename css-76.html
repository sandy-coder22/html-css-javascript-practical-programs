<!DOCTYPE html>
<html>
<head>
<title>CSS 76 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:80px auto;padding:20px;text-align:center}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 13px;border-radius:20px;font-size:12px}
h1{font-size:45px}.desc{color:#999}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:50px}
.spinner{width:55px;height:55px;border:5px solid #2a2a2a;border-top-color:#ff6422;border-radius:50%;margin:25px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 76</span>
<h1>Loading State</h1>
<p class="desc">CSS loading indicator for a SaaS interface.</p>
<div class="card">
<div class="spinner"></div>
<h2>Loading workspace...</h2>
<p class="desc">Please wait while your data is being prepared.</p>
</div>
</main>
</body>
</html>
