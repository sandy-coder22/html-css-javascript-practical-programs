<!DOCTYPE html>
<html>
<head>
<title>CSS 62 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:1000px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.panel{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:40px}
.avatar{width:60px;height:60px;background:#ff6422;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;margin-right:-12px;border:3px solid #151515}
.small{width:45px;height:45px;font-size:13px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 62</span>
<h1>Avatars & Groups</h1>
<p class="desc">User avatars and grouped profile indicators.</p>

<div class="panel">
<h3>Single Avatar</h3>
<div class="avatar">AK</div>

<h3>Avatar Group</h3>
<div>
<div class="avatar small">AK</div>
<div class="avatar small">RS</div>
<div class="avatar small">DM</div>
<div class="avatar small">+8</div>
</div>
</div>
</main>
</body>
</html>
