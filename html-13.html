<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Experiment 13</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: white;
            padding: 40px;
        }

        .box {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: #171717;
            border-left: 4px solid #ff6422;
            border-radius: 8px;
        }

        h1 {
            color: #ff6422;
        }

        .container {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            flex: 1;
            padding: 20px;
            background-color: #222222;
            border: 1px solid #444;
            border-radius: 5px;
        }

        .card h2 {
            color: #ff6422;
        }

        .card p {
            color: #cccccc;
            line-height: 1.5;
        }

        /* Responsive design */
        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .box {
                margin: 20px auto;
                padding: 20px;
            }

            .container {
                flex-direction: column;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Responsive Web Design</h1>

        <p>
            This webpage changes its layout according to
            the screen size.
        </p>

        <div class="container">

            <div class="card">
                <h2>HTML</h2>
                <p>
                    HTML is used to create the structure
                    of a webpage.
                </p>
            </div>

            <div class="card">
                <h2>CSS</h2>
                <p>
                    CSS is used to style and design
                    a webpage.
                </p>
            </div>

            <div class="card">
                <h2>JavaScript</h2>
                <p>
                    JavaScript is used to add functionality
                    to webpages.
                </p>
            </div>

        </div>

    </div>

</body>

</html>
