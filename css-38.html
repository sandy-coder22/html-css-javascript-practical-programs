<!DOCTYPE html>
<html>
<head>
<title>CSS 38 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 7%}
.logo{font-size:25px;font-weight:bold;margin-right:auto}.logo span{color:#ff6422}
.links a{color:#999;text-decoration:none;margin-left:25px}
.menu{display:none;color:#ff6422;font-size:25px}
main{max-width:1000px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}

@media(max-width:700px){
.links{display:none}
.menu{display:block}
}
</style>
</head>
<body>

<nav>
<div class="logo">Dev<span>Core.</span></div>

<div class="links">
<a href="#">Home</a>
<a href="#">Analytics</a>
<a href="#">Projects</a>
<a href="#">Settings</a>
</div>

<div class="menu">☰</div>
</nav>

<main>
<span class="tag">CSS PRACTICAL 38</span>
<h1>Responsive Navigation</h1>
<p class="desc">Resize the browser to see the responsive navigation.</p>
</main>

</body>
</html>
