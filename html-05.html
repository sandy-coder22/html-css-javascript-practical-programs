<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Experiment 5</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: white;
            padding: 40px;
        }

        .box {
            max-width: 650px;
            margin: 50px auto;
            padding: 30px;
            background-color: #171717;
            border-left: 4px solid #ff6422;
            border-radius: 8px;
        }

        h1 {
            color: #ff6422;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            background-color: #0d0d0d;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
        }

        button {
            margin-top: 20px;
            padding: 11px 25px;
            background-color: #ff6422;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e65315;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Student Registration Form</h1>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" placeholder="Enter your password">

            <label>Date of Birth</label>
            <input type="date">

            <label>Gender</label>

            <input type="radio" name="gender"> Male

            <input type="radio" name="gender"> Female

            <label>Course</label>

            <select>
                <option>Select Course</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>Mechanical</option>
            </select>

            <label>Address</label>

            <textarea rows="4" placeholder="Enter your address"></textarea>

            <label>
                <input type="checkbox">
                I agree to the terms and conditions
            </label>

            <button type="submit">Register</button>

        </form>

    </div>

</body>
</html>
