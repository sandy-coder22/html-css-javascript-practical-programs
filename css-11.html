<!DOCTYPE html>
<html>
<head>
    <title>Width and Height | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        nav a {
            color: #999999;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6422;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 45px;
        }

        .description {
            color: #999999;
        }

        .card {
            margin-top: 40px;
            background: #151515;
            border: 1px solid #2a2a2a;
            padding: 30px;
            border-radius: 10px;
        }

        .box {
            background: #0b0b0b;
            border: 2px solid #ff6422;
            padding: 20px;
            margin: 25px 0;
        }

        .fixed {
            width: 400px;
            height: 120px;
        }

        .responsive {
            width: 80%;
            min-width: 300px;
            max-width: 700px;
            min-height: 100px;
            max-height: 200px;
        }

        .title {
            color: #ff6422;
        }

        .info {
            color: #999999;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Dev<span>Core.</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 11</div>

    <h1>Width & Height</h1>

    <p class="description">
        Width, height, min-width, max-width, min-height and max-height.
    </p>

    <div class="card">

        <div class="box fixed">
            <h2 class="title">Fixed Size</h2>
            <p class="info">
                Width: 400px<br>
                Height: 120px
            </p>
        </div>

        <div class="box responsive">
            <h2 class="title">Limited Size</h2>
            <p class="info">
                Min-width: 300px<br>
                Max-width: 700px<br>
                Min-height: 100px<br>
                Max-height: 200px
            </p>
        </div>

    </div>

</div>

</body>
</html>
