<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Experiment 4</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: white;
            padding: 40px;
        }

        .box {
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            background-color: #171717;
            border-left: 4px solid #ff6422;
            border-radius: 8px;
        }

        h1 {
            color: #ff6422;
        }

        h2 {
            color: #ff6422;
            margin-top: 30px;
        }

        img {
            width: 300px;
            border-radius: 8px;
            display: block;
            margin: 20px 0;
        }

        a {
            color: #ff6422;
            text-decoration: none;
            font-size: 18px;
        }

        a:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Images and Hyperlinks</h1>

        <h2>My Image</h2>

        <img src="https://picsum.photos/300/200"
             alt="Sample Image">

        <h2>Useful Links</h2>

        <p>
            Visit
            <a href="https://www.google.com" target="_blank">
                Google
            </a>
        </p>

        <p>
            Visit
            <a href="https://www.github.com" target="_blank">
                GitHub
            </a>
        </p>

    </div>

</body>
</html>
