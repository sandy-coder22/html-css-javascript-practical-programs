<!DOCTYPE html>
<html>
<head>
    <title>CSS Loading Spinner | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        nav a {
            color: #999999;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6422;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 45px;
        }

        .description {
            color: #999999;
        }

        .card {
            margin-top: 40px;
            background: #151515;
            border: 1px solid #2a2a2a;
            padding: 70px;
            border-radius: 10px;
            text-align: center;
        }

        .spinner {
            width: 90px;
            height: 90px;
            border: 8px solid #2a2a2a;
            border-top: 8px solid #ff6422;
            border-radius: 50%;
            margin: 30px auto;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        .loading {
            color: #ff6422;
            font-size: 20px;
        }

        .note {
            color: #999999;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Dev<span>Core.</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 21</div>

    <h1>CSS Loading Spinner</h1>

    <p class="description">
        Creating a loading spinner and animation using CSS.
    </p>

    <div class="card">

        <div class="spinner"></div>

        <div class="loading">
            Loading...
        </div>

        <p class="note">
            This spinner is created using CSS border
            and keyframe animation.
        </p>

    </div>

</div>

</body>
</html>
