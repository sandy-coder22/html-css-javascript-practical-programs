<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Experiment 12</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: white;
            padding: 40px;
        }

        .box {
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            background-color: #171717;
            border-left: 4px solid #ff6422;
            border-radius: 8px;
        }

        h1 {
            color: #ff6422;
        }

        h2 {
            color: #ff6422;
            margin-top: 25px;
        }

        p {
            color: #cccccc;
            font-size: 18px;
            line-height: 1.6;
        }

        /* Class selector */
        .highlight {
            color: #ff6422;
            font-weight: bold;
        }

        /* ID selector */
        #special {
            background-color: #222222;
            padding: 15px;
            border: 1px solid #ff6422;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>CSS Selectors, Colors and Fonts</h1>

        <h2>Element Selector</h2>

        <p>
            This paragraph is styled using an element selector.
        </p>

        <h2>Class Selector</h2>

        <p class="highlight">
            This paragraph uses a class selector.
        </p>

        <h2>ID Selector</h2>

        <p id="special">
            This paragraph uses an ID selector.
        </p>

        <h2>Font Styling</h2>

        <p style="font-family: Georgia; font-size: 20px;">
            This text demonstrates different font styles.
        </p>

    </div>

</body>

</html>
