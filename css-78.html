<!DOCTYPE html>
<html>
<head>
<title>CSS 78 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 8%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:70px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:30px;margin:20px 0}
.bar{height:12px;background:#292929;border-radius:20px;overflow:hidden;margin:12px 0 25px}
.fill{height:100%;background:#ff6422;border-radius:20px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Progress Bars</h1>
<div class="card">
<p>Website Development — 85%</p><div class="bar"><div class="fill" style="width:85%"></div></div>
<p>UI Design — 65%</p><div class="bar"><div class="fill" style="width:65%"></div></div>
<p>Testing — 40%</p><div class="bar"><div class="fill" style="width:40%"></div></div>
<p>Deployment — 20%</p><div class="bar"><div class="fill" style="width:20%"></div></div>
</div>
</main>
</body>
</html>
