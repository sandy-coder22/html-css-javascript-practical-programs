<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Experiment 6</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: white;
            padding: 40px;
        }

        .box {
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            background-color: #171717;
            border-left: 4px solid #ff6422;
            border-radius: 8px;
        }

        h1 {
            color: #ff6422;
        }

        h2 {
            color: #ff6422;
            margin-top: 30px;
        }

        audio,
        video {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Audio and Video</h1>

        <h2>Audio</h2>

        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>

        <h2>Video</h2>

        <video controls>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support video.
        </video>

    </div>

</body>
</html>
