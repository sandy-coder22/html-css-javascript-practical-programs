<!DOCTYPE html>
<html>
<head>
    <title>CSS Background | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        nav a {
            color: #999999;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6422;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 45px;
        }

        .description {
            color: #999999;
        }

        .background-demo {
            height: 400px;
            margin-top: 40px;
            padding: 40px;
            border: 1px solid #2a2a2a;

            background-color: #151515;

            background-image:
                linear-gradient(
                    rgba(11,11,11,0.8),
                    rgba(21,21,21,0.8)
                );

            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .background-demo h2 {
            color: #ff6422;
            font-size: 35px;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Dev<span>Core.</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 05</div>

    <h1>Background Properties</h1>

    <p class="description">
        Background color, image, position, size, repeat and attachment.
    </p>

    <div class="background-demo">

        <div>
            <h2>Background Demo</h2>

            <p>
                CSS Background Properties
            </p>
        </div>

    </div>

</div>

</body>
</html>
