<!DOCTYPE html>
<html>
<head>
<title>CSS 43 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:1000px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.tabs{display:flex;gap:5px;border-bottom:1px solid #2a2a2a}
.tab{padding:15px 25px;color:#999;cursor:pointer}
.tab:hover,.active{color:#ff6422;border-bottom:2px solid #ff6422}
.content{background:#151515;padding:30px;border:1px solid #2a2a2a;border-top:0}
</style>
</head>
<body>

<nav><div class="logo">Dev<span>Core.</span></div></nav>

<main>
<span class="tag">CSS PRACTICAL 43</span>
<h1>Tab Navigation</h1>
<p class="desc">Modern SaaS tab interface.</p>

<div class="tabs">
<div class="tab active">Overview</div>
<div class="tab">Analytics</div>
<div class="tab">Projects</div>
<div class="tab">Settings</div>
</div>

<div class="content">
<h2>Overview</h2>
<p>Welcome to your DevCore workspace.</p>
</div>

</main>
</body>
</html>
