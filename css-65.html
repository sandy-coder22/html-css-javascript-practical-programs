<!DOCTYPE html>
<html>
<head>
<title>CSS 65 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:900px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.toast{position:relative;background:#151515;border:1px solid #ff6422;border-radius:12px;padding:18px 22px;max-width:400px;box-shadow:0 15px 40px #000}
.toast strong{color:#ff6422}
.close{float:right;color:#999}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 65</span>
<h1>Toast Notification</h1>
<p class="desc">A floating toast message component.</p>

<div class="toast">
<span class="close">×</span>
<strong>Success</strong>
<p>Your project has been saved successfully.</p>
</div>
</main>
</body>
</html>
