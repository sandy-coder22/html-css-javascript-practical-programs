<!DOCTYPE html>
<html>
<head>
<title>CSS 77 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:70px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:25px}
.skeleton{background:linear-gradient(90deg,#1b1b1b,#303030,#1b1b1b);background-size:200% 100%;animation:load 1.5s infinite;border-radius:8px}
.avatar{width:55px;height:55px;border-radius:50%}.line{height:14px;margin:12px 0}.big{width:60%;height:25px}
@keyframes load{to{background-position:-200% 0}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Skeleton Loading</h1>
<div class="card">
<div style="display:flex;gap:15px;align-items:center">
<div class="skeleton avatar"></div>
<div style="flex:1">
<div class="skeleton big"></div>
<div class="skeleton line" style="width:40%"></div>
</div>
</div>
<hr style="border-color:#2a2a2a">
<div class="skeleton line"></div>
<div class="skeleton line" style="width:80%"></div>
<div class="skeleton line" style="width:65%"></div>
</div>
</main>
</body>
</html>
