<!DOCTYPE html>
<html>
<head>
    <title>Object Fit & Position | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        nav a {
            color: #999999;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6422;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 45px;
        }

        .description {
            color: #999999;
        }

        .cards {
            display: flex;
            gap: 25px;
            margin-top: 40px;
        }

        .card {
            flex: 1;
            background: #151515;
            border: 1px solid #2a2a2a;
            padding: 25px;
            border-radius: 10px;
        }

        .card h2 {
            color: #ff6422;
        }

        .image-box {
            width: 100%;
            height: 250px;
            background: #0b0b0b;
            border: 1px solid #2a2a2a;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .contain img {
            object-fit: contain;
        }

        .top img {
            object-position: top;
        }

        @media (max-width: 700px) {
            .cards {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Dev<span>Core.</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 15</div>

    <h1>Object Fit & Position</h1>

    <p class="description">
        Using object-fit and object-position for images.
    </p>

    <div class="cards">

        <div class="card">

            <h2>Object Fit: Cover</h2>

            <div class="image-box">
                <img
                    src="https://picsum.photos/600/400"
                    alt="Sample Image">
            </div>

        </div>

        <div class="card contain">

            <h2>Object Fit: Contain</h2>

            <div class="image-box">
                <img
                    src="https://picsum.photos/600/400"
                    alt="Sample Image">
            </div>

        </div>

    </div>

    <div class="card top" style="margin-top:25px;">

        <h2>Object Position: Top</h2>

        <div class="image-box">
            <img
                src="https://picsum.photos/600/400"
                alt="Sample Image">
        </div>

    </div>

</div>

</body>
</html>
