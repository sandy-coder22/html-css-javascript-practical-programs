<!DOCTYPE html>
<html>
<head>
    <title>SaaS Sidebar | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #111111;
            border-right: 1px solid #2a2a2a;
            padding: 30px 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .logo span {
            color: #ff6422;
        }

        .menu-title {
            color: #666666;
            font-size: 12px;
            letter-spacing: 2px;
            margin: 20px 0 10px;
        }

        .menu a {
            display: block;
            color: #999999;
            text-decoration: none;
            padding: 13px;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .menu a:hover,
        .menu .active {
            background: #151515;
            color: #ff6422;
        }

        .content {
            margin-left: 250px;
            padding: 70px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 45px;
        }

        p {
            color: #999999;
        }
    </style>
</head>

<body>

<aside class="sidebar">

    <div class="logo">
        Dev<span>Core.</span>
    </div>

    <div class="menu-title">MAIN</div>

    <div class="menu">
        <a class="active" href="#">Dashboard</a>
        <a href="#">Analytics</a>
        <a href="#">Projects</a>
        <a href="#">Team</a>
    </div>

    <div class="menu-title">SYSTEM</div>

    <div class="menu">
        <a href="#">Settings</a>
        <a href="#">Help</a>
        <a href="#">Logout</a>
    </div>

</aside>

<main class="content">

    <div class="tag">&gt; CSS PRACTICAL 23</div>

    <h1>SaaS Sidebar Navigation</h1>

    <p>
        A fixed sidebar navigation for a SaaS dashboard.
    </p>

</main>

</body>
</html>
