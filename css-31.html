<!DOCTYPE html>
<html>
<head>
<title>CSS 31 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
nav a{color:#999;text-decoration:none;margin-left:20px}
main{max-width:1000px;margin:60px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:45px}.desc{color:#999}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:40px;text-align:center;transition:all .4s}
.card:hover{background:#1d120e;border-color:#ff6422;transform:translateY(-10px);box-shadow:0 20px 40px #ff642233}
button{background:#ff6422;color:#fff;border:0;padding:12px 20px;border-radius:8px;transition:.4s}
button:hover{padding:12px 35px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div><div><a href="#">Home</a><a href="#">CSS</a></div></nav>
<main>
<span class="tag">CSS PRACTICAL 31</span>
<h1>CSS Transitions</h1>
<p class="desc">Hover over the card and button.</p>

<div class="card">
<h2>Hover Animation</h2>
<p>Colors, shadows, size and position transition smoothly.</p>
<button>Hover Me</button>
</div>
</main>
</body>
</html>
