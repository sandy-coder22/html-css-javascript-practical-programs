<!DOCTYPE html>
<html>
<head>
<title>CSS 64 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:900px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.alert{padding:18px;border-radius:12px;margin:15px 0;border:1px solid #333;background:#151515}
.alert strong{color:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 64</span>
<h1>Alerts</h1>
<p class="desc">Notification and alert components.</p>

<div class="alert"><strong>Information:</strong> Your workspace is ready.</div>
<div class="alert"><strong>Success:</strong> Project created successfully.</div>
<div class="alert"><strong>Warning:</strong> Storage usage is getting high.</div>
<div class="alert"><strong>Error:</strong> Unable to complete the request.</div>
</main>
</body>
</html>
