<!DOCTYPE html>
<html>
<head>
    <title>CSS Transitions | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        nav a {
            color: #999999;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6422;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 45px;
        }

        .description {
            color: #999999;
        }

        .card {
            margin-top: 40px;
            background: #151515;
            border: 1px solid #2a2a2a;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
        }

        .box {
            width: 180px;
            height: 100px;
            background: #ff6422;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0b0b0b;
            font-weight: bold;

            transition:
                width 0.5s,
                height 0.5s,
                background-color 0.5s,
                box-shadow 0.5s,
                transform 0.5s;
        }

        .box:hover {
            width: 280px;
            height: 150px;
            background-color: #f5f5f5;
            box-shadow: 0 0 25px #ff6422;
            transform: translateY(-10px);
        }

        .note {
            color: #999999;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Dev<span>Core.</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 17</div>

    <h1>CSS Transitions</h1>

    <p class="description">
        Transitions for colors, sizes, shadows and positions.
    </p>

    <div class="card">

        <p class="note">
            Move your mouse over the box.
        </p>

        <div class="box">
            HOVER ME
        </div>

    </div>

</div>

</body>
</html>
