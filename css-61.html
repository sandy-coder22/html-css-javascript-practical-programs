<!DOCTYPE html>
<html>
<head>
<title>CSS 61 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:1000px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.panel{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:35px}
.badge,.chip{display:inline-block;padding:7px 13px;border-radius:20px;margin:6px;border:1px solid #333;color:#bbb}
.orange{background:#1b120e;color:#ff6422;border-color:#55301f}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 61</span>
<h1>Badges & Tags</h1>
<p class="desc">Labels and chips for modern SaaS interfaces.</p>

<div class="panel">
<span class="badge orange">ACTIVE</span>
<span class="badge">DRAFT</span>
<span class="badge">NEW</span>
<br>
<span class="chip orange">Analytics</span>
<span class="chip">AI</span>
<span class="chip">Design</span>
<span class="chip">Development</span>
</div>
</main>
</body>
</html>
