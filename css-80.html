<!DOCTYPE html>
<html>
<head>
<title>CSS 80 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 8%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:750px;margin:70px auto;padding:20px}
.timeline{border-left:2px solid #333;padding-left:30px}
.item{position:relative;background:#151515;border:1px solid #2a2a2a;padding:20px;border-radius:12px;margin:25px 0}
.item:before{content:"";position:absolute;left:-39px;top:25px;width:14px;height:14px;background:#ff6422;border-radius:50%}
.time{color:#999;font-size:13px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Activity Timeline</h1>
<div class="timeline">
<div class="item"><b>Project created</b><p class="time">09:00 AM</p></div>
<div class="item"><b>Design uploaded</b><p class="time">11:30 AM</p></div>
<div class="item"><b>Development started</b><p class="time">02:15 PM</p></div>
<div class="item"><b>Testing completed</b><p class="time">05:00 PM</p></div>
</div>
</main>
</body>
</html>
