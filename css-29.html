<!DOCTYPE html>
<html>
<head>
<title>CSS 29 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
nav a{color:#999;text-decoration:none;margin-left:20px}
main{max-width:1000px;margin:60px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:45px}.desc{color:#999}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.card{background:#151515;border:1px solid #2a2a2a;padding:20px;border-radius:15px}
img{width:100%;height:250px;border-radius:12px;object-fit:cover}
.fit{object-fit:contain;background:#080808}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div><div><a href="#">Home</a><a href="#">CSS</a></div></nav>
<main>
<span class="tag">CSS PRACTICAL 29</span>
<h1>Object Fit & Position</h1>
<p class="desc">Controlling how images fit inside containers.</p>

<div class="grid">
<div class="card">
<h2>object-fit: cover</h2>
<img src="https://picsum.photos/700/400?1">
</div>

<div class="card">
<h2>object-fit: contain</h2>
<img class="fit" src="https://picsum.photos/700/400?2">
</div>
</div>
</main>
</body>
</html>
