<!DOCTYPE html>
<html>
<head>
<title>CSS 47 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:900px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.profile{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:35px;text-align:center;max-width:420px;margin:auto}
.avatar{width:90px;height:90px;border-radius:50%;background:#ff6422;display:flex;align-items:center;justify-content:center;margin:auto;font-size:30px;font-weight:bold}
.role{color:#ff6422}
.stats{display:flex;justify-content:space-around;border-top:1px solid #2a2a2a;margin-top:25px;padding-top:20px}
.stats span{display:block;color:#999}
</style>
</head>
<body>

<nav><div class="logo">Dev<span>Core.</span></div></nav>

<main>
<span class="tag">CSS PRACTICAL 47</span>
<h1>Profile Card</h1>
<p class="desc">User profile component.</p>

<div class="profile">
<div class="avatar">DC</div>
<h2>DevCore User</h2>
<p class="role">Product Designer</p>
<p>Building modern SaaS experiences and scalable interfaces.</p>

<div class="stats">
<div><strong>24</strong><span>Projects</span></div>
<div><strong>12K</strong><span>Views</span></div>
<div><strong>86</strong><span>Tasks</span></div>
</div>
</div>

</main>
</body>
</html>
