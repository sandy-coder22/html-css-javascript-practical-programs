<!DOCTYPE html>
<html>
<head>
<title>CSS 68 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:900px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
button{background:#ff6422;color:white;border:0;padding:13px 22px;border-radius:8px}
.modal{margin-top:40px;background:#151515;border:1px solid #ff6422;border-radius:16px;padding:30px;max-width:500px;box-shadow:0 20px 60px #000}
.close{float:right;color:#999;font-size:20px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 68</span>
<h1>Modal Dialog</h1>
<p class="desc">Modern modal component.</p>

<button>Open Modal</button>

<div class="modal">
<span class="close">×</span>
<h2>Confirm Action</h2>
<p>Are you sure you want to continue with this action?</p>
<button>Continue</button>
</div>
</main>
</body>
</html>
