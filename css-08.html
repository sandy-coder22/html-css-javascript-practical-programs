<!DOCTYPE html>
<html>
<head>
    <title>CSS Gradients | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        nav a {
            color: #999999;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6422;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 45px;
        }

        .description {
            color: #999999;
        }

        .gradient {
            height: 220px;
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #2a2a2a;
            font-size: 24px;
            font-weight: bold;
        }

        .linear {
            background: linear-gradient(
                to right,
                #0b0b0b,
                #ff6422
            );
        }

        .radial {
            background: radial-gradient(
                circle,
                #ff6422,
                #0b0b0b
            );
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Dev<span>Core.</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 07</div>

    <h1>CSS Gradients</h1>

    <p class="description">
        Linear and radial CSS gradients.
    </p>

    <div class="gradient linear">
        Linear Gradient
    </div>

    <div class="gradient radial">
        Radial Gradient
    </div>

</div>

</body>
</html>
