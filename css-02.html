<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        nav a {
            color: #999999;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6422;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
            font-size: 14px;
        }

        h1 {
            font-size: 45px;
            margin: 15px 0;
        }

        .description {
            color: #999999;
            font-size: 18px;
        }

        .card {
            margin-top: 40px;
            padding: 30px;
            background: #151515;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
        }

        .card h2 {
            color: #ff6422;
        }

        .example {
            padding: 20px;
            background: #0b0b0b;
            border-left: 3px solid #ff6422;
            margin-top: 20px;
        }

        #special {
            color: #ff6422;
        }

        input[type="text"] {
            background: #0b0b0b;
            color: white;
            border: 1px solid #ff6422;
            padding: 10px;
        }

        button {
            background: #ff6422;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Dev<span>Core.</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 02</div>

    <h1>CSS Selectors</h1>

    <p class="description">
        Universal, Element, Class, ID, Attribute and Grouping selectors.
    </p>

    <div class="card">

        <h2>Selector Examples</h2>

        <div class="example">

            <h3>Element Selector</h3>

            <p>This paragraph is styled using an element selector.</p>

            <h3 id="special">ID Selector</h3>

            <p class="example-text">
                This uses a class selector.
            </p>

            <input type="text" placeholder="Attribute Selector">

            <br>

            <button>Submit</button>

        </div>

    </div>

</div>

</body>
</html>
