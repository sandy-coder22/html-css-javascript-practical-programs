<!DOCTYPE html>
<html>
<head>
    <title>CSS Keyframe Animation | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        nav a {
            color: #999999;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6422;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 45px;
        }

        .description {
            color: #999999;
        }

        .card {
            margin-top: 40px;
            background: #151515;
            border: 1px solid #2a2a2a;
            padding: 50px;
            border-radius: 10px;
            overflow: hidden;
        }

        .animation-area {
            height: 250px;
            position: relative;
        }

        .ball {
            width: 70px;
            height: 70px;
            background: #ff6422;
            border-radius: 50%;
            position: absolute;

            animation: moveBall 3s infinite alternate ease-in-out;
        }

        @keyframes moveBall {

            0% {
                left: 0;
                top: 0;
            }

            50% {
                left: 45%;
                top: 120px;
                transform: scale(1.3);
            }

            100% {
                left: 85%;
                top: 0;
            }
        }

        .note {
            color: #999999;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Dev<span>Core.</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 20</div>

    <h1>CSS Keyframe Animation</h1>

    <p class="description">
        Creating animations using CSS @keyframes.
    </p>

    <div class="card">

        <p class="note">
            The orange circle is animated using keyframes.
        </p>

        <div class="animation-area">

            <div class="ball"></div>

        </div>

    </div>

</div>

</body>
</html>
