<!DOCTYPE html>
<html>
<head>
<title>CSS 71 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:900px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.palette{max-width:600px;background:#151515;border:1px solid #ff6422;border-radius:16px;padding:15px;margin-top:30px;box-shadow:0 25px 70px #000}
input{width:100%;background:#0b0b0b;border:1px solid #2a2a2a;color:white;padding:15px;border-radius:9px}
.item{padding:15px;border-radius:8px;color:#aaa;margin-top:5px}
.item:hover{background:#21130d;color:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 71</span>
<h1>Command Palette</h1>
<p class="desc">Quick-access command interface.</p>

<div class="palette">
<input placeholder="Search commands...">
<div class="item">⌘ Dashboard</div>
<div class="item">⌘ Analytics</div>
<div class="item">⌘ Create Project</div>
<div class="item">⌘ Settings</div>
</div>
</main>
</body>
</html>
