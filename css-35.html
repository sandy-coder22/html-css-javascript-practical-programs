<!DOCTYPE html>
<html>
<head>
<title>CSS 35 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
nav a{color:#999;text-decoration:none;margin-left:20px}
main{max-width:1000px;margin:60px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:45px}.desc{color:#999}
.loader-box{height:300px;background:#151515;border:1px solid #2a2a2a;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.spinner{width:65px;height:65px;border:6px solid #333;border-top:6px solid #ff6422;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
p{color:#999}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div><div><a href="#">Home</a><a href="#">CSS</a></div></nav>
<main>
<span class="tag">CSS PRACTICAL 35</span>
<h1>Loading Spinner</h1>
<p class="desc">CSS-only loading animation.</p>

<div class="loader-box">
<div class="spinner"></div>
<p>Loading DevCore...</p>
</div>
</main>
</body>
</html>
