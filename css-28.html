<!DOCTYPE html>
<html>
<head>
<title>CSS 28 | DevCore</title>
<style>
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;padding:0 8%}
.logo{font-size:1.5rem;font-weight:bold}.logo span{color:#ff6422}
nav a{color:#999;text-decoration:none;margin-left:20px}
main{max-width:1000px;margin:60px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:.75rem}
h1{font-size:3rem}.desc{color:#999}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:15px;padding:2rem}
.card strong{display:block;color:#ff6422;font-size:1.3rem}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav>
<div class="logo">Dev<span>Core.</span></div>
<div><a href="#">Home</a><a href="#">CSS</a></div>
</nav>
<main>
<span class="tag">CSS PRACTICAL 28</span>
<h1>CSS Units</h1>
<p class="desc">em, rem, vw, vh and percentage units.</p>

<div class="grid">
<div class="card"><strong>rem</strong>Root based unit</div>
<div class="card"><strong>em</strong>Parent based unit</div>
<div class="card"><strong>vw</strong>Viewport width</div>
<div class="card"><strong>vh</strong>Viewport height</div>
</div>
</main>
</body>
</html>
