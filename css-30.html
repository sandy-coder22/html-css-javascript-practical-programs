<!DOCTYPE html>
<html>
<head>
<title>CSS 30 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
nav a{color:#999;text-decoration:none;margin-left:20px}
main{max-width:1100px;margin:60px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:45px}.desc{color:#999}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#151515;border:1px solid #2a2a2a;padding:20px;border-radius:15px}
img{width:100%;height:200px;object-fit:cover;border-radius:10px}
.blur{filter:blur(4px)}
.gray{filter:grayscale(100%)}
.bright{filter:brightness(1.7)}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div><div><a href="#">Home</a><a href="#">CSS</a></div></nav>
<main>
<span class="tag">CSS PRACTICAL 30</span>
<h1>CSS Filters</h1>
<p class="desc">Blur, grayscale and brightness filters.</p>

<div class="grid">
<div class="card"><h2>Blur</h2><img class="blur" src="https://picsum.photos/500/300?3"></div>
<div class="card"><h2>Grayscale</h2><img class="gray" src="https://picsum.photos/500/300?4"></div>
<div class="card"><h2>Brightness</h2><img class="bright" src="https://picsum.photos/500/300?5"></div>
</div>
</main>
</body>
</html>
