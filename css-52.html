<!DOCTYPE html>
<html>
<head>
<title>CSS 52 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:1100px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px}
.title{color:#999;font-size:13px}
.value{font-size:36px;font-weight:bold;margin:8px 0}
.bar{height:7px;background:#292929;border-radius:10px;overflow:hidden}
.fill{height:100%;background:#ff6422}
small{color:#ff6422}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 52</span>
<h1>KPI & Metric Cards</h1>
<p class="desc">Key performance indicators for a SaaS dashboard.</p>

<div class="grid">
<div class="card">
<div class="title">Monthly Revenue</div>
<div class="value">₹84,200</div>
<small>82% of target</small>
<div class="bar"><div class="fill" style="width:82%"></div></div>
</div>

<div class="card">
<div class="title">Conversion Rate</div>
<div class="value">7.42%</div>
<small>74% of target</small>
<div class="bar"><div class="fill" style="width:74%"></div></div>
</div>

<div class="card">
<div class="title">Customer Growth</div>
<div class="value">68%</div>
<small>68% of target</small>
<div class="bar"><div class="fill" style="width:68%"></div></div>
</div>
</div>
</main>
</body>
</html>
