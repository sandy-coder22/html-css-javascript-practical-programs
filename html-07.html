<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Experiment 7</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: white;
            padding: 40px;
        }

        .box {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: #171717;
            border-left: 4px solid #ff6422;
            border-radius: 8px;
        }

        h1 {
            color: #ff6422;
        }

        h2 {
            color: #ff6422;
        }

        iframe {
            width: 100%;
            height: 350px;
            border: 1px solid #555;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Frames and Iframes</h1>

        <h2>Iframe Example</h2>

        <iframe
            src="https://www.wikipedia.org"
            title="Wikipedia">
        </iframe>

    </div>

</body>

</html>
