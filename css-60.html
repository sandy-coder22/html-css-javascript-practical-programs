<!DOCTYPE html>
<html>
<head>
<title>CSS 60 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:1000px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.actions{display:flex;gap:15px;align-items:center;background:#151515;border:1px solid #2a2a2a;padding:35px;border-radius:16px}
.icon{width:45px;height:45px;border-radius:10px;background:#222;border:1px solid #333;color:#ff6422;font-size:20px;cursor:pointer}
.icon:hover{background:#ff6422;color:white}
.action{background:#ff6422;color:white;border:0;padding:12px 18px;border-radius:8px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 60</span>
<h1>Icon & Action Buttons</h1>
<p class="desc">Compact controls for SaaS interfaces.</p>

<div class="actions">
<button class="icon">+</button>
<button class="icon">⋮</button>
<button class="icon">⌕</button>
<button class="action">Create Project</button>
</div>
</main>
</body>
</html>
