<!DOCTYPE html>
<html>
<head>
<title>CSS 70 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:900px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.drawer{position:fixed;right:0;top:70px;width:330px;height:calc(100vh - 70px);background:#151515;border-left:1px solid #2a2a2a;padding:30px;box-shadow:-20px 0 50px #000}
.drawer h2{color:#ff6422}
.drawer p{color:#999}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 70</span>
<h1>Slide-out Drawer</h1>
<p class="desc">A right-side SaaS drawer panel.</p>

<div class="drawer">
<h2>Project Details</h2>
<p>Project: Analytics Dashboard</p>
<p>Status: Active</p>
<p>Members: 12</p>
</div>
</main>
</body>
</html>
