<!DOCTYPE html>
<html>
<head>
    <title>CSS 2D Transformations | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        nav a {
            color: #999999;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6422;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 45px;
        }

        .description {
            color: #999999;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: #151515;
            border: 1px solid #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .card h2 {
            color: #ff6422;
        }

        .box {
            width: 120px;
            height: 120px;
            background: #ff6422;
            color: #0b0b0b;
            margin: 40px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .rotate {
            transform: rotate(25deg);
        }

        .scale {
            transform: scale(1.3);
        }

        .translate {
            transform: translate(30px, -15px);
        }

        .skew {
            transform: skew(15deg, 5deg);
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Dev<span>Core.</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 18</div>

    <h1>CSS 2D Transformations</h1>

    <p class="description">
        Rotate, scale, translate and skew transformations.
    </p>

    <div class="grid">

        <div class="card">
            <h2>Rotate</h2>
            <div class="box rotate">ROTATE</div>
        </div>

        <div class="card">
            <h2>Scale</h2>
            <div class="box scale">SCALE</div>
        </div>

        <div class="card">
            <h2>Translate</h2>
            <div class="box translate">MOVE</div>
        </div>

        <div class="card">
            <h2>Skew</h2>
            <div class="box skew">SKEW</div>
        </div>

    </div>

</div>

</body>
</html>
