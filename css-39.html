<!DOCTYPE html>
<html>
<head>
<title>CSS 39 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
.drawer{position:fixed;left:0;top:0;width:280px;height:100vh;background:#111;border-right:1px solid #2a2a2a;padding:25px}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
.close{float:right;color:#ff6422;font-size:25px}
a{display:block;color:#999;text-decoration:none;padding:15px 5px;border-bottom:1px solid #222}
a:hover{color:#ff6422}
main{margin-left:280px;padding:80px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
@media(max-width:600px){
.drawer{width:85%}
main{display:none}
}
</style>
</head>
<body>

<div class="drawer">
<span class="close">×</span>
<div class="logo">Dev<span>Core.</span></div>

<br><br>
<a href="#">Dashboard</a>
<a href="#">Analytics</a>
<a href="#">Projects</a>
<a href="#">Team</a>
<a href="#">Settings</a>
</div>

<main>
<span class="tag">CSS PRACTICAL 39</span>
<h1>Mobile Sidebar Drawer</h1>
<p class="desc">A responsive mobile navigation drawer.</p>
</main>

</body>
</html>
