<!DOCTYPE html>
<html>
<head>
<title>CSS 81 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:430px;margin:70px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:35px}
input{width:100%;padding:14px;margin:8px 0 18px;background:#0b0b0b;border:1px solid #333;border-radius:8px;color:white}
button{width:100%;padding:14px;background:#ff6422;border:0;border-radius:8px;font-weight:bold}
label{color:#aaa}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card">
<h1>Welcome Back</h1><p style="color:#999">Login to your account.</p>
<label>Email</label><input type="email" placeholder="you@example.com">
<label>Password</label><input type="password" placeholder="••••••••">
<button>Login</button>
<p style="color:#999;text-align:center">Forgot password?</p>
</div></main>
</body>
</html>
