<!DOCTYPE html>

<head>

<style>

main{max-width:1000px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}

.breadcrumb{background:#151515;border:1px solid #2a2a2a;padding:20px;border-radius:12px}
.breadcrumb a{color:#999;text-decoration:none}
.breadcrumb a:hover{color:#ff6422}
.current{color:#ff6422}

</head>

<nav>

</nav>

<main>
<span class="tag">CSS PRACTICAL 42</span>

<div class="breadcrumb">
<a href="#">Home</a>
<span> / </span>
<a href="#">Projects</a>
<span> / </span>
<a href="#">Web Design</a>
<span> / </span>

</html>
