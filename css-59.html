<!DOCTYPE html>
<html>
<head>
<title>CSS 59 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:1000px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.buttons{display:flex;gap:15px;flex-wrap:wrap;background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:35px}
button{padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold}
.primary{background:#ff6422;color:white;border:1px solid #ff6422}
.secondary{background:#222;color:white;border:1px solid #333}
.outline{background:transparent;color:#ff6422;border:1px solid #ff6422}
.danger{background:#551b12;color:white;border:1px solid #8d301f}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 59</span>
<h1>Button Variants</h1>
<p class="desc">Primary, secondary, outline and destructive buttons.</p>

<div class="buttons">
<button class="primary">Primary</button>
<button class="secondary">Secondary</button>
<button class="outline">Outline</button>
<button class="danger">Destructive</button>
</div>
</main>
</body>
</html>
