<!DOCTYPE html>
<html>
<head>
<title>CSS 27 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
nav a{color:#999;text-decoration:none;margin-left:20px}
main{max-width:1000px;margin:60px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:45px}.desc{color:#999}
.demo{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:30px}
.box{width:80%;height:25vh;background:#ff6422;border-radius:15px;padding:25px}
.small{width:50%;height:100px;background:#222;margin-top:20px;padding:20px}
</style>
</head>
<body>
<nav>
<div class="logo">Dev<span>Core.</span></div>
<div><a href="#">Home</a><a href="#">CSS</a></div>
</nav>

<main>
<span class="tag">CSS PRACTICAL 27</span>
<h1>Width & Height Units</h1>
<p class="desc">Percentage and viewport based dimensions.</p>

<div class="demo">
<div class="box">Width: 80% | Height: 25vh</div>
<div class="small">Width: 50% | Height: 100px</div>
</div>
</main>
</body>
</html>
