<!DOCTYPE html>
<html>
<head>
<title>CSS 79 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:80px auto;padding:20px}
.stepper{display:flex;justify-content:space-between;position:relative;margin:60px 0}
.stepper:before{content:"";position:absolute;top:20px;left:5%;right:5%;height:3px;background:#333}
.step{position:relative;text-align:center;z-index:1;width:25%}
.circle{width:42px;height:42px;border-radius:50%;background:#222;border:2px solid #444;margin:auto;display:grid;place-items:center}
.active .circle,.done .circle{background:#ff6422;border-color:#ff6422}
small{color:#999;display:block;margin-top:10px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Progress Stepper</h1>
<div class="stepper">
<div class="step done"><div class="circle">✓</div><small>Account</small></div>
<div class="step done"><div class="circle">✓</div><small>Profile</small></div>
<div class="step active"><div class="circle">3</div><small>Payment</small></div>
<div class="step"><div class="circle">4</div><small>Complete</small></div>
</div>
</main>
</body>
</html>
