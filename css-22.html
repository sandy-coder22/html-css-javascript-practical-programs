<!DOCTYPE html>
<html>
<head>
    <title>SaaS Navigation Bar | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 72px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        .links {
            display: flex;
            gap: 28px;
        }

        .links a {
            color: #999999;
            text-decoration: none;
        }

        .links a:hover {
            color: #ff6422;
        }

        .button {
            background: #ff6422;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
        }

        .container {
            max-width: 1000px;
            margin: 70px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 45px;
        }

        .description {
            color: #999999;
        }
    </style>
</head>

<body>

<nav>

    <div class="logo">
        Dev<span>Core.</span>
    </div>

    <div class="links">
        <a href="#">Dashboard</a>
        <a href="#">Analytics</a>
        <a href="#">Projects</a>
        <a href="#">Settings</a>
    </div>

    <a class="button" href="#">Get Started</a>

</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 22</div>

    <h1>SaaS Navigation Bar</h1>

    <p class="description">
        A modern navigation bar for a SaaS application.
    </p>

</div>

</body>
</html>
