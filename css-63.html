<!DOCTYPE html>
<html>
<head>
<title>CSS 63 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:900px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.panel{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:30px}
.divider{height:1px;background:#2a2a2a;margin:30px 0}
.section{padding:10px 0}
.section h2{color:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 63</span>
<h1>Dividers</h1>

<div class="panel">
<div class="section">
<h2>Account</h2>
<p>Manage your account information.</p>
</div>

<div class="divider"></div>

<div class="section">
<h2>Security</h2>
<p>Manage passwords and security settings.</p>
</div>

<div class="divider"></div>

<div class="section">
<h2>Notifications</h2>
<p>Control notification preferences.</p>
</div>
</div>
</main>
</body>
</html>
