<!DOCTYPE html>
<html>
<head>
<title>CSS 49 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:1100px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#151515;border:1px solid #2a2a2a;padding:28px;border-radius:16px;transition:.3s}
.card:hover{border-color:#ff6422;transform:translateY(-6px)}
.icon{font-size:32px;color:#ff6422}
.card p{color:#999}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav><div class="logo">Dev<span>Core.</span></div></nav>

<main>
<span class="tag">CSS PRACTICAL 49</span>
<h1>Feature Cards</h1>
<p class="desc">Highlight important SaaS product features.</p>

<div class="grid">

<div class="card">
<div class="icon">⚡</div>
<h2>Fast Analytics</h2>
<p>Get real-time insights from your workspace.</p>
</div>

<div class="card">
<div class="icon">◈</div>
<h2>AI Automation</h2>
<p>Automate repetitive workflows with smart tools.</p>
</div>

<div class="card">
<div class="icon">◆</div>
<h2>Team Collaboration</h2>
<p>Work together with a centralized workspace.</p>
</div>

</div>
</main>
</body>
</html>
