<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Experiment 3</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: white;
            padding: 40px;
        }

        .box {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: #171717;
            border-left: 4px solid #ff6422;
            border-radius: 8px;
        }

        h1 {
            color: #ff6422;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #555;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #ff6422;
            color: white;
        }

        td {
            color: #cccccc;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Student Information</h1>

        <table>

            <tr>
                <th colspan="4">Student Details</th>
            </tr>

            <tr>
                <th>Name</th>
                <th>Roll No</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>

            <tr>
                <td>Sandhya</td>
                <td>101</td>
                <td>CSE</td>
                <td>90</td>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>102</td>
                <td>CSE</td>
                <td>85</td>
            </tr>

            <tr>
                <td rowspan="2">Total</td>
                <td colspan="2">Students</td>
                <td>2</td>
            </tr>

            <tr>
                <td colspan="2">Average Marks</td>
                <td>87.5</td>
            </tr>

        </table>

    </div>

</body>
</html>
