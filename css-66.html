<!DOCTYPE html>
<html>
<head>
<title>CSS 66 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:900px;margin:70px auto;padding:20px;text-align:center}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.tooltip{position:relative;display:inline-block;margin-top:80px}
button{background:#ff6422;color:white;border:0;padding:14px 25px;border-radius:8px}
.tip{visibility:hidden;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:#151515;border:1px solid #2a2a2a;padding:10px 15px;border-radius:8px;white-space:nowrap;color:#ddd}
.tooltip:hover .tip{visibility:visible}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 66</span>
<h1>Tooltip</h1>
<p class="desc">Hover over the button.</p>

<div class="tooltip">
<button>Hover Me</button>
<div class="tip">This is a DevCore tooltip</div>
</div>
</main>
</body>
</html>
