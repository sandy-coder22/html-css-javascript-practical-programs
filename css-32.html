<!DOCTYPE html>
<html>
<head>
<title>CSS 32 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
nav a{color:#999;text-decoration:none;margin-left:20px}
main{max-width:1000px;margin:60px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:45px}.desc{color:#999}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.box{height:150px;background:#151515;border:1px solid #2a2a2a;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#ff6422;font-weight:bold}
.rotate{transform:rotate(8deg)}
.scale{transform:scale(1.08)}
.translate{transform:translateY(-10px)}
.skew{transform:skew(-8deg)}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div><div><a href="#">Home</a><a href="#">CSS</a></div></nav>
<main>
<span class="tag">CSS PRACTICAL 32</span>
<h1>2D Transformations</h1>
<p class="desc">Rotate, scale, translate and skew.</p>

<div class="grid">
<div class="box rotate">ROTATE</div>
<div class="box scale">SCALE</div>
<div class="box translate">TRANSLATE</div>
<div class="box skew">SKEW</div>
</div>
</main>
</body>
</html>
