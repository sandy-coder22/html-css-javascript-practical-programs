<!DOCTYPE html>
<html>
<head>
    <title>Box Sizing | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        nav a {
            color: #999999;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6422;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 45px;
        }

        .description {
            color: #999999;
        }

        .boxes {
            display: flex;
            gap: 25px;
            margin-top: 40px;
        }

        .box {
            width: 50%;
            height: 250px;
            padding: 30px;
            border: 5px solid #ff6422;
            background: #151515;
        }

        .content-box {
            box-sizing: content-box;
        }

        .border-box {
            box-sizing: border-box;
        }

        .box h2 {
            color: #ff6422;
        }

        .box p {
            color: #999999;
        }

        @media (max-width: 700px) {
            .boxes {
                flex-direction: column;
            }

            .box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Dev<span>Core.</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 12</div>

    <h1>CSS Box-Sizing</h1>

    <p class="description">
        Difference between content-box and border-box.
    </p>

    <div class="boxes">

        <div class="box content-box">

            <h2>Content-Box</h2>

            <p>
                Padding and border are added outside
                the specified width and height.
            </p>

        </div>

        <div class="box border-box">

            <h2>Border-Box</h2>

            <p>
                Padding and border are included
                inside the specified width and height.
            </p>

        </div>

    </div>

</div>

</body>
</html>
