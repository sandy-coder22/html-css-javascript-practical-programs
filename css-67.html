<!DOCTYPE html>
<html>
<head>
<title>CSS 67 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:900px;margin:70px auto;padding:20px;text-align:center}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.popover{display:inline-block;position:relative;margin-top:50px}
button{background:#ff6422;color:white;border:0;padding:13px 22px;border-radius:8px}
.box{display:none;position:absolute;top:55px;left:50%;transform:translateX(-50%);width:260px;background:#151515;border:1px solid #2a2a2a;border-radius:12px;padding:20px;text-align:left}
.popover:hover .box{display:block}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 67</span>
<h1>Popover</h1>
<p class="desc">Hover over the button to open the popover.</p>

<div class="popover">
<button>More Information</button>
<div class="box">
<h3>Workspace Info</h3>
<p>This workspace contains your analytics and project data.</p>
</div>
</div>
</main>
</body>
</html>
