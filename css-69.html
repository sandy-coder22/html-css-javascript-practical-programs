<!DOCTYPE html>
<html>
<head>
<title>CSS 69 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.dialog{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:30px;max-width:500px}
.warning{color:#ff6422;font-size:30px}
button{padding:12px 20px;border-radius:8px;border:1px solid #333;background:#222;color:white;margin-right:10px}
.confirm{background:#ff6422;border-color:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 69</span>
<h1>Confirmation Dialog</h1>
<p class="desc">Confirmation dialog before an important action.</p>

<div class="dialog">
<div class="warning">!</div>
<h2>Delete Project?</h2>
<p>This action requires confirmation before continuing.</p>
<button>Cancel</button>
<button class="confirm">Confirm</button>
</div>
</main>
</body>
</html>
