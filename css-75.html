<!DOCTYPE html>
<html>
<head>
<title>CSS 75 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:900px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.success{text-align:center;background:#151515;border:1px solid #ff6422;border-radius:18px;padding:70px 20px}
.check{width:70px;height:70px;border-radius:50%;background:#ff6422;color:white;font-size:40px;display:flex;align-items:center;justify-content:center;margin:auto}
button{background:#ff6422;border:0;color:#fff;padding:12px 22px;border-radius:8px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<span class="tag">CSS PRACTICAL 75</span>
<h1>Success State</h1>
<p class="desc">Successful action feedback component.</p>

<div class="success">
<div class="check">✓</div>
<h2>Project Created!</h2>
<p class="desc">Your new project has been successfully created.</p>
<button>View Project</button>
</div>
</main>
</body>
</html>
