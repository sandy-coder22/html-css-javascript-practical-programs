<!DOCTYPE html>
<html>
<head>
<title>CSS 57 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:clamp(45px,7vw,80px);line-height:1;margin:20px 0}
p{color:#999;font-size:18px;max-width:650px;margin:0 auto 30px}
button{background:#ff6422;border:0;color:white;padding:14px 24px;border-radius:9px;font-weight:bold}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>

<main>
<div>
<span class="tag">SAAS PLATFORM</span>
<h1>Build smarter.<br><span style="color:#ff6422">Move faster.</span></h1>
<p>DevCore brings analytics, automation and AI tools into one modern workspace.</p>
<button>Start Building</button>
</div>
</main>
</body>
</html>
