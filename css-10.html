<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        nav a {
            color: #999999;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6422;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
            font-size: 14px;
        }

        h1 {
            font-size: 45px;
            margin: 15px 0;
        }

        .description {
            color: #999999;
            font-size: 18px;
        }

        .box-area {
            margin-top: 50px;
            background: #151515;
            border: 1px solid #2a2a2a;
            padding: 50px;
        }

        .margin-area {
            background: #222222;
            padding: 30px;
            margin: 20px;
        }

        .border-area {
            background: #0b0b0b;
            border: 5px solid #ff6422;
            padding: 30px;
        }

        .content-area {
            background: #151515;
            padding: 30px;
            text-align: center;
        }

        .content-area h2 {
            color: #ff6422;
        }

        .label {
            color: #999999;
            font-size: 13px;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Dev<span>Core.</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 10</div>

    <h1>CSS Box Model</h1>

    <p class="description">
        Content, padding, border and margin.
    </p>

    <div class="box-area">

        <div class="margin-area">

            <p class="label">MARGIN</p>

            <div class="border-area">

                <p class="label">BORDER</p>

                <div class="content-area">

                    <p class="label">PADDING</p>

                    <h2>CONTENT</h2>

                    <p>
                        This is the content area.
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
