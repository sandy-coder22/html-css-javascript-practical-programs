<!DOCTYPE html>
<html>
<head>
<title>CSS 48 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:1000px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
.product{max-width:380px;background:#151515;border:1px solid #2a2a2a;border-radius:18px;overflow:hidden}
.product-img{height:210px;background:linear-gradient(135deg,#ff6422,#29140b);display:flex;align-items:center;justify-content:center;font-size:55px}
.info{padding:25px}
.price{font-size:28px;color:#ff6422;font-weight:bold}
button{background:#ff6422;color:#fff;border:0;padding:12px 20px;border-radius:8px;width:100%}
</style>
</head>
<body>

<nav><div class="logo">Dev<span>Core.</span></div></nav>

<main>
<span class="tag">CSS PRACTICAL 48</span>
<h1>Product Card</h1>
<p class="desc">Modern SaaS product card.</p>

<div class="product">
<div class="product-img">◆</div>

<div class="info">
<h2>DevCore Pro</h2>
<p>Professional analytics workspace.</p>
<div class="price">₹999 / month</div>
<br>
<button>Choose Product</button>
</div>
</div>

</main>
</body>
</html>
