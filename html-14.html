<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Components</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .box {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: #171717;
            border-left: 4px solid #ff6422;
            border-radius: 8px;
        }

        h1 {
            color: #ff6422;
        }

        .card {
            background-color: #222;
            color: white;
        }

        .btn-custom {
            background-color: #ff6422;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background-color: #e65315;
            color: white;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Bootstrap Components</h1>

        <!-- Alert -->
        <div class="alert alert-warning mt-4">
            Welcome to Bootstrap!
        </div>

        <!-- Card -->
        <div class="card mt-4">

            <div class="card-body">

                <h2 class="card-title">
                    Bootstrap Card
                </h2>

                <p class="card-text">
                    Bootstrap provides ready-made components
                    for creating responsive webpages.
                </p>

                <button class="btn btn-custom">
                    Click Me
                </button>

            </div>

        </div>

        <!-- Progress Bar -->
        <h2 class="mt-4">Progress Bar</h2>

        <div class="progress mt-3">

            <div class="progress-bar"
                 style="width: 75%;">
                75%
            </div>

        </div>

    </div>

</body>

</html>
