<!DOCTYPE html>
<html>
<head>
<title>CSS 40 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold;margin-right:auto}.logo span{color:#ff6422}
nav a{color:#999;text-decoration:none;margin:0 18px}
.dropdown{position:relative;display:inline-block}
.dropdown-menu{display:none;position:absolute;top:30px;left:0;background:#151515;border:1px solid #2a2a2a;border-radius:10px;width:180px;padding:10px}
.dropdown-menu a{display:block;padding:10px;margin:0}
.dropdown:hover .dropdown-menu{display:block}
main{max-width:1000px;margin:70px auto;padding:20px}
.tag{color:#ff6422;border:1px solid #55301f;padding:7px 12px;border-radius:20px;font-size:12px}
h1{font-size:48px}.desc{color:#999}
</style>
</head>
<body>

<nav>
<div class="logo">Dev<span>Core.</span></div>

<a href="#">Home</a>

<div class="dropdown">
<a href="#">Menu ▾</a>
<div class="dropdown-menu">
<a href="#">Dashboard</a>
<a href="#">Projects</a>
<a href="#">Analytics</a>
<a href="#">Settings</a>
</div>
</div>

<a href="#">Contact</a>
</nav>

<main>
<span class="tag">CSS PRACTICAL 40</span>
<h1>Dropdown Navigation</h1>
<p class="desc">Hover over Menu to open the dropdown.</p>
</main>

</body>
</html>
