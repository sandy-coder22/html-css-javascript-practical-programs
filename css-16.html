<!DOCTYPE html>
<html>
<head>
    <title>CSS Filters | DevCore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6422;
        }

        nav a {
            color: #999999;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6422;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .tag {
            color: #ff6422;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 45px;
        }

        .description {
            color: #999999;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: #151515;
            border: 1px solid #2a2a2a;
            padding: 20px;
            border-radius: 10px;
        }

        .card h2 {
            color: #ff6422;
            font-size: 20px;
        }

        .image {
            height: 150px;
            width: 100%;
            object-fit: cover;
        }

        .blur {
            filter: blur(4px);
        }

        .grayscale {
            filter: grayscale(100%);
        }

        .brightness {
            filter: brightness(1.7);
        }

        .contrast {
            filter: contrast(180%);
        }

        .transparent {
            filter: opacity(50%);
        }

        @media (max-width: 700px) {
            .filters {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Dev<span>Core.</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</nav>

<div class="container">

    <div class="tag">&gt; CSS PRACTICAL 16</div>

    <h1>CSS Filters</h1>

    <p class="description">
        Blur, grayscale, brightness, contrast and opacity filters.
    </p>

    <div class="filters">

        <div class="card">
            <h2>Blur</h2>
            <img class="image blur"
                 src="https://picsum.photos/400/250">
        </div>

        <div class="card">
            <h2>Grayscale</h2>
            <img class="image grayscale"
                 src="https://picsum.photos/400/250">
        </div>

        <div class="card">
            <h2>Brightness</h2>
            <img class="image brightness"
                 src="https://picsum.photos/400/250">
        </div>

        <div class="card">
            <h2>Contrast</h2>
            <img class="image contrast"
                 src="https://picsum.photos/400/250">
        </div>

        <div class="card">
            <h2>Opacity</h2>
            <img class="image transparent"
                 src="https://picsum.photos/400/250">
        </div>

    </div>

</div>

</body>
</html>
